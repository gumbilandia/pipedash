<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Plumber Dash · Pipe Kingdom</title>

<!-- Viewport: sin zoom, cubriendo notch de iPhone -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">

<!-- PWA -->
<meta name="theme-color" content="#5C94FC">
<link rel="manifest" href="manifest.json">

<!-- iOS: abrir como app standalone, sin barra de Safari -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plumber Dash">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<!-- Android / Chrome -->
<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <canvas id="game"></canvas>

  <!-- capa de UI: solo textos/HUD, ningún botón visible de control -->
  <div id="hud">
    <div id="score">0</div>
    <div id="best">Mejor: 0</div>
  </div>

  <button id="muteBtn" aria-label="silenciar">🔊</button>

  <div id="startScreen" class="overlay">
    <h1>PLUMBER<br>DASH</h1>
    <p class="subtitle">Pipe Kingdom · Modo Infinito</p>
    <p class="hint">Toca la pantalla para volar<br>y esquiva las tuberías verdes</p>
    <div class="tapPrompt">TOCA PARA JUGAR</div>
  </div>

  <div id="gameOverScreen" class="overlay hidden">
    <h2>¡GAME OVER!</h2>
    <p id="finalScore">Puntuación: 0</p>
    <p id="bestScoreText">Mejor: 0</p>
    <div class="tapPrompt">TOCA PARA REINTENTAR</div>
  </div>
</div>

<script src="audio.js"></script>
<script src="game.js"></script>
<script>
// Registrar el service worker para que funcione offline y arranque como app real
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
</body>
</html>
